stages:
  data_ingestion:
    cmd: python src/chicken_disease_classification/pipeline/stage_01_data_ingestion.py
    deps:
      - src/chicken_disease_classification/pipeline/stage_01_data_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/Chicken-fecal-images

  data_validation:
    cmd: python src/chicken_disease_classification/pipeline/stage_02_data_validation.py
    deps:
      - src/chicken_disease_classification/pipeline/stage_02_data_validation.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
    outs:
      - artifacts/data_validation/status.txt

  prepare_base_model:
    cmd: python src/chicken_disease_classification/pipeline/stage_03_prepare_base_model.py
    deps:
      - src/chicken_disease_classification/pipeline/stage_03_prepare_base_model.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model

  training:
    cmd: python src/chicken_disease_classification/pipeline/stage_04_training.py
    deps:
      - src/chicken_disease_classification/pipeline/stage_04_training.py
      - src/chicken_disease_classification/components/prepare_callbacks.py
      - config/config.yaml
      - artifacts/data_validation/status.txt
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/prepare_base_model
    params:
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
      - IMAGE_SIZE
    outs:
      - artifacts/training/model.h5

  evaluation:
    cmd: python src/chicken_disease_classification/pipeline/stage_05_evaluation.py
    deps:
      - src/chicken_disease_classification/pipeline/stage_05_evaluation.py
      - config/config.yaml
      - artifacts/data_ingestion/Chicken-fecal-images
      - artifacts/training/model.h5
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    metrics:
      - scores.json:
          cache: false

